name: Delete branch of closed PR

# Merged PRs already lose their branch through the repository setting
# "Automatically delete head branches". This covers PRs closed without a
# merge. Only branches with nothing of their own (no commits outside the
# base) are deleted: long-lived feat/ branches, branches from forks and
# main/dev are left alone.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'feat/') &&
      !contains(fromJSON('["main", "dev"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # ahead_by counts commits on the branch that the base lacks. On any
          # API failure the branch is kept: deletion must never lose commits.
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH" --jq .ahead_by) || ahead=keep
          if [ "$ahead" != "0" ]; then
            echo "Keeping $BRANCH ($ahead commits outside $BASE, or base unknown)"
            exit 0
          fi
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"; then
            echo "Deleted $BRANCH"
          else
            echo "Could not delete $BRANCH (already gone or protected by a ruleset)"
          fi
