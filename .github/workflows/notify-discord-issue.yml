name: Notify Discord on New Issue

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to notify Discord about'
        required: true
        default: '192'

permissions:
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post issue alert to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ISSUE_THREAD_ID: ${{ secrets.DISCORD_ISSUE_THREAD_ID || '1542647578548772954' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          import urllib.error

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              print("Warning: DISCORD_WEBHOOK_URL is not set. Skipping Discord notification.")
              sys.exit(0)

          thread_id = os.environ.get("DISCORD_ISSUE_THREAD_ID", "").strip() or "1542647578548772954"
          endpoint = webhook
          if thread_id:
              sep = "&" if "?" in webhook else "?"
              endpoint = f"{webhook}{sep}thread_id={thread_id}"

          number = os.environ.get("ISSUE_NUMBER", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          url = os.environ.get("ISSUE_URL", "").strip()
          author = os.environ.get("ISSUE_AUTHOR", "").strip()
          labels = os.environ.get("ISSUE_LABELS", "").strip()

          input_number = os.environ.get("INPUT_ISSUE_NUMBER", "").strip()
          if not number and input_number:
              try:
                  out = subprocess.check_output(
                      ["gh", "issue", "view", input_number, "--json", "number,title,url,author,labels"],
                      text=True
                  )
                  data = json.loads(out)
                  number = str(data.get("number", input_number))
                  title = data.get("title", "(no title)")
                  url = data.get("url", "")
                  author = data.get("author", {}).get("login", "someone")
                  labels = ", ".join(lbl.get("name", "") for lbl in data.get("labels", []) if lbl.get("name"))
              except Exception as e:
                  print(f"Error resolving issue #{input_number}: {e}", file=sys.stderr)
                  sys.exit(1)

          description = f"Opened by @{author}"
          if labels:
              description += f" • {labels}"

          embed = {
              "title": f"Issue #{number}: {title}"[:256],
              "url": url,
              "description": description,
              "color": 0xE67E22,
          }
          payload = {"username": "TortoiseBots Issue", "embeds": [embed]}

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "TortoiseBots-Issue-Notifier/1.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  if resp.status not in (200, 204):
                      print(f"Discord API unexpected status {resp.status}", file=sys.stderr)
                      sys.exit(1)
          except urllib.error.HTTPError as e:
              print(f"Discord API error HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}", file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"Network error sending to Discord: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Posted alert for #{number} to Discord thread {thread_id}.")
          PYEOF
