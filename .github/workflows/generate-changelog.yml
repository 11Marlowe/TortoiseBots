name: Generate Changelog & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja wydania (np. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.actor == 'Sagiroth' || github.actor == 'sagiroth'
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key (release environment, main only): the main ruleset
          # lets it push the changelog commit and tags; GITHUB_TOKEN cannot.
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute build version
        id: version
        run: |
          NEW_VER="${{ inputs.version }}"
          echo "$NEW_VER" > VERSION
          echo "build_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Notes
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ENDPOINT: ${{ secrets.OPENCODE_ENDPOINT }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
        run: |
          python3 tools/generate_changelog.py --write --out-notes /tmp/release_notes.md --out-delta /tmp/discord_notes.md --date "${{ steps.version.outputs.build_version }} (${{ steps.version.outputs.release_date }})"

      - name: Commit CHANGELOG.md and VERSION
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION
          git commit -m "docs: release ${{ steps.version.outputs.release_tag }} [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
          git tag -f "${{ steps.version.outputs.release_tag }}"
          git push -f origin "${{ steps.version.outputs.release_tag }}"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_ARG=""
          if [ -f /tmp/release_notes.md ]; then
            NOTES_ARG="--notes-file /tmp/release_notes.md"
          else
            NOTES_ARG="--notes 'Release ${{ steps.version.outputs.release_tag }}'"
          fi

          if gh release view "${{ steps.version.outputs.release_tag }}" --json tagName >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.release_tag }} already exists. Updating release notes..."
            gh release edit "${{ steps.version.outputs.release_tag }}" \
              --title "TortoiseBots ${{ steps.version.outputs.release_tag }}" \
              $NOTES_ARG \
              --latest
          else
            echo "Creating new release ${{ steps.version.outputs.release_tag }}..."
            gh release create "${{ steps.version.outputs.release_tag }}" \
              --title "TortoiseBots ${{ steps.version.outputs.release_tag }}" \
              $NOTES_ARG \
              --target main \
              --latest
          fi

      - name: Post Changelog to Discord Thread
        if: steps.generate.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/post_discord_changelog.py \
            --notes /tmp/discord_notes.md \
            --title "TortoiseBots ${{ steps.version.outputs.release_tag }}" \
            --tag "${{ steps.version.outputs.release_tag }}" \
            --thread-id "${{ secrets.DISCORD_CHANGELOG_THREAD_ID || '1559276000293158953' }}" \
            --username "TortoiseBots Changelog"
