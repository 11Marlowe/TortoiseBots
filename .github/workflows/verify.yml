name: Verify

# The offline checks (OKF docs, module surface, wiring, standalone policy and
# unit tests) run on every pull request and on pushes to the long-lived
# branches. No core checkout: the host-contract and DBC steps in the script
# skip themselves when the core/DBC is absent. tools/ is not filtered out —
# a change to the checks themselves must be checked too.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ ripgrep zlib1g-dev

      - name: Run offline checks
        run: bash tools/verify_all.sh
