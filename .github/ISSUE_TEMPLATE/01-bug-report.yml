name: Bug report
description: Report a problem with TortoiseBots.
title: "[bug][area]: "
labels:
  - bug

body:
  - type: dropdown
    id: area
    attributes:
      label: What does this relate to?
      description: "Optional: put a short area in the title too, e.g. [bug][commander], [feature][random-bots], [bug][combat]."
      options:
        - Combat or class behavior
        - Movement or travel
        - Levelling, questing, or the random bot pool
        - Hired companions or my own bots
        - Remote commander
        - Dungeon, LFT, raid, or battleground
        - Auction house or economy
        - Commands or the TortoiseBotsManager addon
        - Dashboard
        - Build or configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Do this...
        2. Then do this...
        3. The problem happens...
    validations:
      required: true

  - type: dropdown
    id: gm-mode
    attributes:
      label: Were you playing on a GM account?
      description: A GM in GM mode or hidden (.gm on / .gm visible off) cannot receive buffs or heals, so bots behave differently around them.
      options:
        - "No"
        - Yes, GM mode on (.gm on)
        - Yes, hidden (.gm visible off)
        - GM account, GM mode off
        - Not sure
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Anything that helps us reproduce it.
      placeholder: |
        Your character: level, class, race
        Bots involved: class, level, and type (hired, my own alt, random pool bot)
        Solo, party or raid; zone or dungeon
        Settings you changed in aiplayerbot.conf; number of random bots
        How often it happens (always, sometimes, once)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TortoiseBots version
      description: The release (Server tab of the dashboard, or the VERSION file), or the commit if you build from source.
      placeholder: v1.1.0
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or other evidence
      description: |
        Optional, but it helps a lot. Drag screenshots here, and attach the bot logs from the server's logs folder
        (`bot_events.csv` and `deaths.csv`, or the hourly `.csv.gz` packs from around the time it happened).
        If you run the dashboard, paste the diagnostic report from its Server tab.
